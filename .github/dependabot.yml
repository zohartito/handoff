# Standard automation onboarding (PR-Janitor). Keep npm deps + GitHub Actions current.
# Modeled on arch-line-weights/.github/dependabot.yml.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
