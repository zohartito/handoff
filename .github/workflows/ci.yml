name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - name: unit tests
        run: npm test

  smoke:
    name: smoke (${{ matrix.os }}, packed install)
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: pack + install globally
        shell: bash
        run: |
          npm pack
          TARBALL=$(ls zohartito-handoff-*.tgz | head -1)
          npm install -g "./$TARBALL"
      - name: frozen command surface (all operating systems)
        shell: bash
        run: |
          set -euo pipefail
          scratch_dir="$(mktemp -d)"
          handoff --help >/dev/null
          test "$(handoff --version)" = "0.9.2"
          for tool in claude-code claude-desktop cursor codex; do
            handoff uninstall --tool "$tool" >"$scratch_dir/handoff-uninstall-$tool.txt"
            test -s "$scratch_dir/handoff-uninstall-$tool.txt"
          done

          smoke_dir="$scratch_dir/handoff-frozen-smoke"
          mkdir -p "$smoke_dir/.handoff"
          printf 'preserve-this-history\n' >"$smoke_dir/.handoff/keep.txt"
          cd "$smoke_dir"

          expect_refusal() {
            name="$1"
            shift
            if handoff "$@" >"$scratch_dir/handoff-$name.stdout" 2>"$scratch_dir/handoff-$name.stderr"; then
              echo "expected refusal: handoff $*" >&2
              exit 1
            fi
            grep -qi "permanently disabled" "$scratch_dir/handoff-$name.stderr"
            test "$(cat .handoff/keep.txt)" = "preserve-this-history"
          }

          expect_refusal init init --from claude-code
          expect_refusal status status
          expect_refusal save save
          expect_refusal attempt attempt x
          expect_refusal decide decide x
          expect_refusal correct correct x
          expect_refusal capture capture --from stdin
          expect_refusal prime prime --tool codex
          expect_refusal install install --tool cursor
          expect_refusal doctor doctor
          expect_refusal hook hook UserPromptSubmit
          expect_refusal switch switch codex
          expect_refusal ingest ingest --from codex
          expect_refusal obsidian obsidian
          expect_refusal search search x
          expect_refusal patterns patterns
          expect_refusal verify verify
          expect_refusal mcp mcp
          expect_refusal evaluate evaluate
          expect_refusal sync sync
