name: ci (security-disabled)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Deliberately no checkout, setup, package, or third-party action runs here.
# An owner must restore CI only after reviewing current full commit SHAs,
# permissions, event scope, and the frozen release-surface checks locally.
jobs:
  disabled-pending-reviewed-pins:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "CI is disabled pending reviewed immutable action pins."
          exit 1
