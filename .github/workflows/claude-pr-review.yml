name: PR Review (security-disabled)

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions: {}

# Do not expose a credential or PR content to a provider action until an owner
# has reviewed an immutable commit pin and a least-privilege event design.
jobs:
  disabled-pending-reviewed-pins:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "PR review is disabled pending reviewed immutable action pins and an event-bound design."
          exit 1
